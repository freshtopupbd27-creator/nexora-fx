
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NEXORA FX | Bot Store</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080808;color:#eee;font-family:Arial,sans-serif}
header{background:#111;padding:18px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #b99539}
h1,h2,h3{color:#d9b44a}
button{background:#d9b44a;color:#111;border:0;padding:11px 16px;border-radius:6px;font-weight:bold;cursor:pointer;margin:4px}
input,textarea,select{width:100%;padding:12px;margin:7px 0;background:#181818;color:white;border:1px solid #555;border-radius:6px}
.container{max-width:1000px;margin:auto;padding:18px}
.card{background:#151515;border:1px solid #514323;border-radius:10px;padding:15px;margin:12px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:15px}
img{max-width:100%;border-radius:8px}
.hidden{display:none}
.gold{color:#d9b44a}
.small{color:#aaa;font-size:13px}
.gallery{display:flex;gap:8px;overflow:auto}
.gallery img{width:100%;max-height:260px;object-fit:contain}
#message{color:#e5c66b;white-space:pre-wrap}
</style>
</head>
<body>

<header>
  <h2>NEXORA FX</h2>
  <button id="accountButton" onclick="showLogin()">Login</button>
</header>

<div class="container">
  <section id="authBox" class="card hidden">
    <h2>Account Login / Registration</h2>
    <input id="email" type="email" placeholder="Email address">
    <input id="password" type="password" placeholder="Password">
    <button onclick="login()">Login</button>
    <button onclick="register()">Create Account</button>
    <button onclick="closeLogin()">Close</button>
    <p class="small">Use your registered email and password.</p>
  </section>

  <section>
    <h2>Premium Trading Bots</h2>
    <p class="small">Explore our MT4, MT5 and OTC trading bot collection.</p>
    <div id="bots" class="grid">Loading bots...</div>
  </section>

  <section id="details" class="card hidden">
    <h2 id="detailName"></h2>
    <div id="detailImages" class="gallery"></div>
    <button onclick="previousImage()">Previous</button>
    <button onclick="nextImage()">Next</button>
    <p id="detailDescription"></p>
    <p id="detailSL"></p>
    <p id="detailTP"></p>
    <p id="detailCapital"></p>
    <p id="detailPlatforms"></p>
    <h3 id="detailPrice"></h3>
    <button onclick="contactTelegram()">Buy / Contact on Telegram</button>
  </section>

  <section id="adminPanel" class="card hidden">
    <h2>Admin Panel</h2>
    <p class="small">Add or manage your trading bots.</p>
    <input id="botName" placeholder="Bot name">
    <textarea id="botDescription" placeholder="Bot description"></textarea>
    <input id="botSL" placeholder="Stop Loss">
    <input id="botTP" placeholder="Profit Target">
    <input id="botCapital" placeholder="Minimum Capital">
    <input id="botPrice" placeholder="Bot Price">
    <input id="botPlatforms" placeholder="Platforms e.g. MT4, MT5, OTC">
    <label>Upload bot images</label>
    <input id="botImages" type="file" accept="image/*" multiple>
    <button onclick="saveBot()">Save Bot</button>
    <button onclick="cancelEdit()">Cancel Edit</button>
    <h3>Manage Bots</h3>
    <div id="adminBots"></div>
  </section>

  <section class="card">
    <p>Telegram: <a href="https://t.me/" style="color:#d9b44a">Contact us</a></p>
    <p>YouTube: <a href="#" style="color:#d9b44a">Our Channel</a></p>
    <p>Facebook: <a href="#" style="color:#d9b44a">Our Page</a></p>
  </section>

  <p id="message"></p>
  <button id="logoutButton" class="hidden" onclick="logout()">Logout</button>
</div>

<script>
const SUPABASE_URL = "https://rhpwkvmwapljuslxkxom.supabase.co";
const SUPABASE_KEY = "sb_publishable_eVXhSc191C6Gw-bp4CAuKQ_h_U9wEfA";
const ADMIN_UID = "7ad49d5a-729c-4449-9628-2e9332d65199";
const TELEGRAM_LINK = "https://t.me/";

const db = window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

let currentUser = null;
let selectedBot = null;
let imageIndex = 0;
let editingBot = null;
let oldImages = [];

function msg(t){document.getElementById("message").textContent=t;}
function showLogin(){document.getElementById("authBox").classList.remove("hidden");}
function closeLogin(){document.getElementById("authBox").classList.add("hidden");}

async function register(){
 const email=document.getElementById("email").value.trim();
 const password=document.getElementById("password").value;
 if(!email||password.length<6){msg("Enter a valid email and password of at least 6 characters.");return;}
 const {error}=await db.auth.signUp({email,password});
 msg(error?error.message:"Registration submitted. Check your email if confirmation is required.");
}

async function login(){
 const email=document.getElementById("email").value.trim();
 const password=document.getElementById("password").value;
 const {data,error}=await db.auth.signInWithPassword({email,password});
 if(error){msg(error.message);return;}
 currentUser=data.user;
 closeLogin();
 await updateAccount();
 await loadBots();
}

async function logout(){
 await db.auth.signOut();
 currentUser=null;
 editingBot=null;
 document.getElementById("adminPanel").classList.add("hidden");
 document.getElementById("logoutButton").classList.add("hidden");
 document.getElementById("accountButton").textContent="Login";
 msg("Logged out.");
}

async function updateAccount(){
 const admin=currentUser && currentUser.id===ADMIN_UID;
 document.getElementById("accountButton").textContent=currentUser?(admin?"Admin Account":"Customer Account"):"Login";
 document.getElementById("logoutButton").classList.toggle("hidden",!currentUser);
 document.getElementById("adminPanel").classList.toggle("hidden",!admin);
 if(admin) await loadAdminBots();
}

async function loadBots(){
 const box=document.getElementById("bots");
 box.textContent="Loading...";
 const {data,error}=await db.from("bots").select("*").eq("is_active",true).order("created_at",{ascending:false});
 if(error){box.textContent=error.message;return;}
 box.innerHTML="";
 if(!data.length){box.textContent="No bots available yet.";return;}
 data.forEach(bot=>{
  const card=document.createElement("div");
  card.className="card";
  const image=bot.images&&bot.images.length?bot.images[0]:"";
  card.innerHTML=`
   ${image?`<img src="${image}" alt="Bot image">`:""}
   <h3></h3><p></p><strong></strong><br>
   <button>View Details</button>`;
  card.querySelector("h3").textContent=bot.name;
  card.querySelector("p").textContent=bot.platforms||"Trading Bot";
  card.querySelector("strong").textContent=bot.price||"Contact for price";
  card.querySelector("button").onclick=()=>showDetails(bot);
  box.appendChild(card);
 });
}

function showDetails(bot){
 selectedBot=bot;imageIndex=0;
 document.getElementById("details").classList.remove("hidden");
 document.getElementById("detailName").textContent=bot.name;
 document.getElementById("detailDescription").textContent=bot.description||"";
 document.getElementById("detailSL").textContent="Stop Loss: "+(bot.stop_loss||"Not specified");
 document.getElementById("detailTP").textContent="Profit Target: "+(bot.profit_target||"Not specified");
 document.getElementById("detailCapital").textContent="Minimum Capital: "+(bot.minimum_capital||"Not specified");
 document.getElementById("detailPlatforms").textContent="Platforms: "+(bot.platforms||"Not specified");
 document.getElementById("detailPrice").textContent="Price: "+(bot.price||"Contact us");
 renderImage();
 document.getElementById("details").scrollIntoView({behavior:"smooth"});
}

function renderImage(){
 const box=document.getElementById("detailImages");
 box.innerHTML="";
 const images=selectedBot?.images||[];
 if(!images.length){box.textContent="No images available";return;}
 const img=document.createElement("img");
 img.src=images[imageIndex];
 box.appendChild(img);
}
function nextImage(){
 const images=selectedBot?.images||[];
 if(images.length){imageIndex=(imageIndex+1)%images.length;renderImage();}
}
function previousImage(){
 const images=selectedBot?.images||[];
 if(images.length){imageIndex=(imageIndex-1+images.length)%images.length;renderImage();}
}
function contactTelegram(){window.open(TELEGRAM_LINK,"_blank");}

async function loadAdminBots(){
 const box=document.getElementById("adminBots");
 const {data,error}=await db.from("bots").select("*").eq("is_active",true).order("created_at",{ascending:false});
 if(error){box.textContent=error.message;return;}
 box.innerHTML="";
 data.forEach(bot=>{
  const row=document.createElement("div");
  row.className="card";
  const name=document.createElement("strong");
  name.textContent=bot.name;
  const edit=document.createElement("button");
  edit.textContent="Edit";
  edit.onclick=()=>editBot(bot);
  const del=document.createElement("button");
  del.textContent="Delete";
  del.onclick=()=>deleteBot(bot);
  row.append(name,edit,del);
  box.appendChild(row);
 });
}

function editBot(bot){
 editingBot=bot.id;
 oldImages=bot.images||[];
 document.getElementById("botName").value=bot.name||"";
 document.getElementById("botDescription").value=bot.description||"";
 document.getElementById("botSL").value=bot.stop_loss||"";
 document.getElementById("botTP").value=bot.profit_target||"";
 document.getElementById("botCapital").value=bot.minimum_capital||"";
 document.getElementById("botPrice").value=bot.price||"";
 document.getElementById("botPlatforms").value=bot.platforms||"";
 document.getElementById("adminPanel").scrollIntoView({behavior:"smooth"});
}
function cancelEdit(){
 editingBot=null;oldImages=[];
 ["botName","botDescription","botSL","botTP","botCapital","botPrice","botPlatforms","botImages"].forEach(id=>document.getElementById(id).value="");
}

async function saveBot(){
 if(!currentUser||currentUser.id!==ADMIN_UID){msg("Admin login required.");return;}
 const name=document.getElementById("botName").value.trim();
 if(!name){msg("Enter bot name.");return;}
 msg("Saving bot...");
 let images=[...oldImages];
 const files=[...document.getElementById("botImages").files];
 for(const file of files){
  if(!file.type.startsWith("image/")){msg("Only image files are allowed.");return;}
  const path=Date.now()+"-"+Math.random().toString(36).slice(2)+"-"+file.name.replace(/[^a-zA-Z0-9._-]/g,"_");
  const {error:uploadError}=await db.storage.from("bot-images").upload(path,file);
  if(uploadError){msg("Image upload error: "+uploadError.message);return;}
  const {data}=db.storage.from("bot-images").getPublicUrl(path);
  images.push(data.publicUrl);
 }
 const bot={
  name,
  description:document.getElementById("botDescription").value,
  stop_loss:document.getElementById("botSL").value,
  profit_target:document.getElementById("botTP").value,
  minimum_capital:document.getElementById("botCapital").value,
  price:document.getElementById("botPrice").value,
  platforms:document.getElementById("botPlatforms").value,
  images,
  is_active:true
 };
 let result;
 if(editingBot){
  result=await db.from("bots").update(bot).eq("id",editingBot);
 }else{
  result=await db.from("bots").insert(bot);
 }
 if(result.error){msg("Database error: "+result.error.message);return;}
 cancelEdit();
 msg("Bot saved successfully.");
 await loadBots();
 await loadAdminBots();
}

async function deleteBot(bot){
 if(!confirm("Delete "+bot.name+"?"))return;
 const {error}=await db.from("bots").delete().eq("id",bot.id);
 if(error){msg(error.message);return;}
 msg("Bot deleted.");
 await loadBots();
 await loadAdminBots();
}

async function start(){
 const {data}=await db.auth.getSession();
 currentUser=data.session?.user||null;
 if(currentUser) await updateAccount();
 await loadBots();
}
db.auth.onAuthStateChange((_event,session)=>{
 currentUser=session?.user||null;
 updateAccount();
});
start();
</script>
</body>
</html>
